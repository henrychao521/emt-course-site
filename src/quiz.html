<header class="chapter-head">
  <div class="chapter-no">五</div>
  <div>
    <p class="kicker">第五章</p>
    <h1>小測驗</h1>
    <p class="lede">每次從題庫依章節與難度平衡抽出 10 題，題型有單選、是非、情境判斷與排序。作答後會顯示解說與出處，可以「再抽一組」。答對不代表會做——技能要在合格課程中練習。</p>
  </div>
</header>

<script>if(location.hash==="#all")document.documentElement.className+=" teacher-mode";</script>
<noscript><style>#bank-all[hidden]{display:block}</style><p>瀏覽器未啟用 JavaScript，無法抽題；以下列出全部題目與答案。</p></noscript>

<div id="quiz-app" hidden>
  <p class="quiz-meta" id="quiz-meta"></p>
  <div class="quiz" id="quiz-list"></div>
  <div class="score">
    <span id="score-text" aria-live="polite"></span>
    <span class="score-btns">
      <button class="btn" id="quiz-redraw" type="button">再抽一組</button>
    </span>
  </div>
  <p class="teacher-link"><a href="#all">教師版：全部題目與答案（可列印）</a></p>
</div>

<section id="bank-all" class="bank-all" hidden>
  <div class="bank-head">
    <h2>題庫全部題目（教師版）</h2>
    <p>共 {{quizcount}} 題。每題附答案、解說、出處與難度。{{quizstats}}</p>
    <p class="bank-actions"><a href="#" id="back-to-quiz">回到測驗</a>　<button class="btn" type="button" id="bank-print">列印</button></p>
  </div>
{{quizall}}
</section>

{{quizdata}}
